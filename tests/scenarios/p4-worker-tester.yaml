agent: "@tester"
steps:
  - plan:
      - "Chạy bộ kiểm thử tự động"
  - message: "Đang chạy kiểm thử cho các API mới..."
  - mcp:
      tool: "write_scratchpad"
      args:
        content: "Tester notes: Tất cả 14 test cases đều pass"
  - sleep: 0.1
  - mcp:
      tool: "report_outcome"
      args:
        status: "done"
        summary: "14/14 tests passed 100%"
